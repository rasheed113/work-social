name: Repair Expense Overview Duplicate Add

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'codex/expense-manager-overview-remove-duplicate-add'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/expense-manager-overview-remove-duplicate-add
          fetch-depth: 0
      - name: Remove duplicate overview Add CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/expense-manager/components/ExpenseOverviewDashboard.tsx')
          s = p.read_text()
          old = '''        <button type="button" className="expense-overview__add" onClick={() => onNavigate('/expense-manager/transactions?intent=add')}>
          <span aria-hidden="true">＋</span> Add transaction
        </button>'''
          new = '''        {!data?.has_financial_records && (
          <button type="button" className="expense-overview__add" onClick={() => onNavigate('/expense-manager/transactions?intent=add')}>
            <span aria-hidden="true">＋</span> Add transaction
          </button>
        )}'''
          if old not in s:
              raise SystemExit('Expected overview toolbar Add button not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: git diff --check
      - run: npm install
      - run: npm run build
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/expense-manager/components/ExpenseOverviewDashboard.tsx
          git rm .github/workflows/repair-expense-overview-add.yml
          git commit -m "fix: remove duplicate overview add transaction action"
          git push origin HEAD:codex/expense-manager-overview-remove-duplicate-add
