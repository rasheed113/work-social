name: apply-offline-routing-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply focused routing/provenance changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path); s = p.read_text()
              if old not in s:
                  raise SystemExit(f'MISSING PATTERN in {path}: {old[:160]!r}')
              if count is None:
                  s2 = s.replace(old, new)
              else:
                  s2 = s.replace(old, new, count)
              p.write_text(s2)

          # Explicit mode is owned by the parent and passed to the real sender component.
          p = 'src/features/ai/components/WorkSocialAiAssistantWithMode.tsx'
          replace(p, "export function WorkSocialAiAssistant({ profileId }: Props) { return (<><BaseWorkSocialAiAssistant profileId={profileId} /><AiChatModeBridge /></>); }", "export function WorkSocialAiAssistant({ profileId }: Props) { const [mode, setMode] = useState<AiRoutingMode>(() => getDefaultAiRoutingMode()); return (<><BaseWorkSocialAiAssistant profileId={profileId} mode={mode} /><AiChatModeBridge mode={mode} onModeChange={setMode} /></>); }")
          replace(p, "function AiChatModeBridge() {", "function AiChatModeBridge({ mode, onModeChange }: { mode: AiRoutingMode; onModeChange: (mode: AiRoutingMode) => void }) {")
          replace(p, "const [header, setHeader] = useState<HTMLElement | null>(null); const [panel, setPanel] = useState<HTMLElement | null>(null); const [mode, setMode] = useState<AiRoutingMode>(() => getDefaultAiRoutingMode());", "const [header, setHeader] = useState<HTMLElement | null>(null); const [panel, setPanel] = useState<HTMLElement | null>(null);")
          replace(p, "setMode(nextMode); setDefaultAiRoutingMode(nextMode);", "onModeChange(nextMode); setDefaultAiRoutingMode(nextMode);")
          replace(p, "setMode(nextMode); }", "onModeChange(nextMode); }")
          # The bridge effect may contain the same setter once; ensure no selected-mode setter remains.
          if 'setMode(' in Path(p).read_text():
              raise SystemExit('AiChatModeBridge still owns selected mode state')

          # Base assistant receives mode as an explicit dependency and preserves provenance.
          p = 'src/features/ai/components/WorkSocialAiAssistant.tsx'
          replace(p, "  type AiPendingAction,\n} from '../api/workSocialAi';", "  type AiPendingAction,\n} from '../api/workSocialAi';\nimport type { AiProviderId, AiProviderMode, AiRoutingMode } from '../providers/contracts';\nimport { offlineAiTrace } from '../runtime/localAiDiagnostics';")
          replace(p, "interface Props { profileId: string; }\ntype UiMessage = Pick<AiMessage, 'id' | 'role' | 'content'>;", "interface Props { profileId: string; mode: AiRoutingMode; }\ntype UiMessage = Pick<AiMessage, 'id' | 'role' | 'content'> & { provider?: AiProviderId; mode?: AiProviderMode };\nfunction readMessageProvenance(message: AiMessage): Pick<UiMessage, 'provider' | 'mode'> { const metadata = message.metadata ?? {}; const provider = metadata.provider === 'local' || metadata.provider === 'gemini' ? metadata.provider : undefined; const mode = metadata.mode === 'offline' || metadata.mode === 'online' ? metadata.mode : undefined; return { provider, mode }; }")
          replace(p, "export function WorkSocialAiAssistant({ profileId: _profileId }: Props) {", "export function WorkSocialAiAssistant({ profileId: _profileId, mode }: Props) {")
          replace(p, "setMessages(items.filter((item) => item.role === 'user' || item.role === 'assistant').map(({ id: messageId, role, content }) => ({ id: messageId, role, content })));", "setMessages(items.filter((item) => item.role === 'user' || item.role === 'assistant').map((item) => ({ id: item.id, role: item.role, content: item.content, ...readMessageProvenance(item) })));" )
          replace(p, "const reply = await sendAiMessage(trimmed, conversationIdRef.current);", "const reply = await sendAiMessage(trimmed, conversationIdRef.current, mode);")
          replace(p, "setMessages((current) => [...current, { id: assistantId, role: 'assistant', content: reply.message }]);", "if (reply.provider !== (reply.mode === 'offline' ? 'local' : 'gemini')) throw new Error(`AI response provenance mismatch: provider=${reply.provider}, mode=${reply.mode}`); if (mode === 'offline' && (reply.provider !== 'local' || reply.mode !== 'offline')) throw new Error(`OFFLINE_ROUTE_VIOLATION: provider=${reply.provider}, mode=${reply.mode}`); setMessages((current) => [...current, { id: assistantId, role: 'assistant', content: reply.message, provider: reply.provider, mode: reply.mode }]);")
          replace(p, "  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, [messages, pendingActions, sending]);", "  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); const latest = messages[messages.length - 1]; if (latest?.role === 'assistant') offlineAiTrace('RESPONSE_RENDERED', { provider: latest.provider ?? null, mode: latest.mode ?? null, provenanceKnown: Boolean(latest.provider && latest.mode) }); }, [messages, pendingActions, sending]);")
          replace(p, ".ws-ai-speaker{display:inline-flex;align-items:center;gap:6px;", ".ws-ai-provenance{display:inline-flex;align-items:center;gap:6px;margin-left:3px;padding:4px 8px;border:1px solid rgba(134,239,172,.2);border-radius:8px;background:rgba(22,101,52,.12);color:#bbf7d0;font-size:10px;font-weight:800}.ws-ai-speaker{display:inline-flex;align-items:center;gap:6px;")
          replace(p, "<div className=\"ws-ai-bubble assistant\">{message.content}</div><button", "<div className=\"ws-ai-bubble assistant\">{message.content}</div>{message.provider && message.mode ? <span className=\"ws-ai-provenance\" aria-label={`Generated by ${message.provider === 'local' ? 'Local Wllama' : 'Gemini'} in ${message.mode} mode`}>{message.provider === 'local' ? 'Local Wllama' : 'Gemini'} · {message.mode === 'offline' ? 'Offline' : 'Online'}</span> : null}<button")

          # Public reply boundary must not discard actual provenance.
          p = 'src/features/ai/api/workSocialAi.ts'
          replace(p, "import { AiRouter, getDefaultAiRoutingMode, type AiRoutingMode } from '../providers/aiRouter';", "import { AiRouter, getDefaultAiRoutingMode, type AiRoutingMode } from '../providers/aiRouter';\nimport { AiRoutingError } from '../providers/contracts';")
          replace(p, "export interface AiReply { conversation_id: string; message: string; pending_actions: AiPendingAction[]; }", "export interface AiReply { conversation_id: string; message: string; pending_actions: AiPendingAction[]; provider: 'gemini' | 'local'; mode: 'online' | 'offline'; }")
          replace(p, "if (requestedMode === 'offline' && response.mode !== 'offline') throw new Error(`OFFLINE routing invariant violated: provider=${response.provider}, mode=${response.mode}`);", "if (requestedMode === 'offline' && (response.provider !== 'local' || response.mode !== 'offline')) throw new AiRoutingError('OFFLINE_ROUTE_VIOLATION', 'offline', 'local', `Offline response provenance mismatch: provider=${response.provider}, mode=${response.mode}`);")
          replace(p, "return { conversation_id: response.conversationId, message: response.message, pending_actions: response.pendingActions.map((action) => ({ id: action.id, display_summary: action.displaySummary, expires_at: action.expiresAt })) };", "return { conversation_id: response.conversationId, message: response.message, pending_actions: response.pendingActions.map((action) => ({ id: action.id, display_summary: action.displaySummary, expires_at: action.expiresAt })), provider: response.provider, mode: response.mode };")

          # Ensure the real Wllama completion is the generation boundary and emits completion trace.
          p = 'src/features/ai/runtime/browserLocalInferenceAdapter.ts'
          replace(p, "const response = await this.engine.createChatCompletion({ messages: toWllamaMessages(request), max_tokens: request.maxTokens, temperature: request.temperature, top_p: request.topP, abortSignal: signal });", "const response = await this.engine.createChatCompletion({ messages: toWllamaMessages(request), max_tokens: request.maxTokens, temperature: request.temperature, top_p: request.topP, abortSignal: signal });")

          # Add a focused API-level routing test with distinguishable provider outputs via a small sender factory test helper.
          test = Path('src/features/ai/providers/offlineRoutingProvenance.test.ts')
          test.write_text('''import type { AiMessage, AiProvider, AiProviderStatus, AiResponse } from './contracts';\nimport { AiRouter } from './aiRouter';\n\nconst request: AiMessage = { id: 'test', conversationId: '', role: 'user', content: 'test' };\nfunction fakeProvider(id: 'gemini' | 'local', ready: boolean, calls: { count: number }): AiProvider {\n  const response: AiResponse = { conversationId: '', message: id === 'local' ? 'LOCAL_WLLAMA_RESPONSE' : 'GEMINI_RESPONSE', pendingActions: [], provider: id, mode: id === 'local' ? 'offline' : 'online' };\n  const status: AiProviderStatus = { state: ready ? 'ready' : 'unavailable', provider: id, mode: id === 'local' ? 'offline' : 'online', reasonCode: ready ? 'LOCAL_RUNTIME_READY' : 'LOCAL_RUNTIME_UNAVAILABLE' };\n  return { id, mode: response.mode, getStatus: () => status, getRoutingStatus: async () => status, sendMessage: async () => { calls.count += 1; return response; } } as AiProvider;\n}\nasync function run(): Promise<void> {\n  const geminiCalls = { count: 0 }; const localCalls = { count: 0 };\n  const router = new AiRouter(fakeProvider('gemini', true, geminiCalls), fakeProvider('local', true, localCalls));\n  const offline = await router.sendMessage([request], [], { mode: 'offline' });\n  if (offline.message !== 'LOCAL_WLLAMA_RESPONSE' || offline.provider !== 'local' || offline.mode !== 'offline') throw new Error('OFFLINE did not return the local provider response.');\n  if (geminiCalls.count !== 0 || localCalls.count !== 1) throw new Error(`Unexpected OFFLINE calls: gemini=${geminiCalls.count}, local=${localCalls.count}`);\n  const online = await router.sendMessage([request], [], { mode: 'online' });\n  if (online.message !== 'GEMINI_RESPONSE' || online.provider !== 'gemini' || online.mode !== 'online') throw new Error('ONLINE did not return Gemini response.');\n  if (geminiCalls.count !== 1) throw new Error('ONLINE did not call Gemini exactly once.');\n  const auto = await router.sendMessage([request], [], { mode: 'auto' });\n  if (auto.message !== 'LOCAL_WLLAMA_RESPONSE' || auto.provider !== 'local') throw new Error('AUTO did not use ready local provider.');\n  if (localCalls.count !== 2) throw new Error('AUTO did not call local provider.');\n  const unavailableLocal = new AiRouter(fakeProvider('gemini', true, { count: 0 }), fakeProvider('local', false, { count: 0 }));\n  try { await unavailableLocal.sendMessage([request], [], { mode: 'offline' }); throw new Error('OFFLINE unexpectedly succeeded with unavailable local provider.'); } catch (error) { if (!(error instanceof Error) || !error.message) throw error; }\n  console.log('Offline routing provenance test passed.');\n}\nvoid run().catch((error) => { console.error(error); throw error; });\n''')
          PY
      - name: Typecheck through production build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-offline-routing-fix.yml
          git add src/features/ai
          git commit -m "fix: enforce end-to-end offline AI routing provenance"
          git push
