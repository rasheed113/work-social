name: Patch Team Work Icon

on:
  push:
    branches:
      - feat/team-work-card-users-icon

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Team Work icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/worker/components/WorkerHome.tsx')
          text = path.read_text()
          old = '<span className="worker-home__resource-icon" aria-hidden="true">◫</span>'
          new = '''<span className="worker-home__resource-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </span>'''
          if old not in text:
              raise SystemExit('Expected Team Work icon markup was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source change and remove patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-team-work-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/worker/components/WorkerHome.tsx .github/workflows/patch-team-work-icon.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: use premium users icon for Team Work card"
          git push origin HEAD
