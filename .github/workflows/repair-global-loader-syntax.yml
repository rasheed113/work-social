name: Repair loader migration syntax
on:
  push:
    branches:
      - fix/worker-personal-finance-redesign
permissions:
  contents: write
jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, 'fix: repair global loader syntax') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore affected pages and apply loader safely
        shell: python
        run: |
          from pathlib import Path
          import re
          parent = '611e4d520ab534afc3450d8fda60bc51ec1a2d00'
          files = [
              'src/features/worker/pages/WorkerIdentityPage.tsx',
              'src/features/worker/pages/WorkerWorkHistoryPage.tsx',
          ]
          import subprocess
          for path in files:
              data = subprocess.check_output(['git', 'show', f'{parent}:{path}'], text=True)
              p = Path(path)
              p.write_text(data)

          p = Path(files[0])
          text = p.read_text()
          if "import { WorkSocialPremiumLoader } from '../../../app/components/WorkSocialPremiumLoader';" not in text:
              text = "import { WorkSocialPremiumLoader } from '../../../app/components/WorkSocialPremiumLoader';\n" + text
          text = text.replace(
              'if (loading) return <main style={{ padding: 24 }}>Loading Work Identity…</main>;',
              'if (loading) return <WorkSocialPremiumLoader title="Worker Identity" message="Loading Work Identity…" />;'
          )
          p.write_text(text)

          p = Path(files[1])
          text = p.read_text()
          if "import { WorkSocialPremiumLoader } from '../../../app/components/WorkSocialPremiumLoader';" not in text:
              text = "import { WorkSocialPremiumLoader } from '../../../app/components/WorkSocialPremiumLoader';\n" + text
          old = '''if (session.loading) return <main className="worker-history"><section className="worker-history__state"><span className="worker-history__state-mark" aria-hidden="true">◌</span><p>Loading Work History…</p></section></main>;'''
          new = 'if (session.loading) return <WorkSocialPremiumLoader title="Worker Work History" message="Loading Work History…" />;'
          if old not in text:
              raise SystemExit('Expected WorkerWorkHistoryPage loading branch not found')
          text = text.replace(old, new)
          p.write_text(text)
      - name: Verify TypeScript
        run: npm install --ignore-scripts && npx tsc -b
      - name: Commit repaired files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-global-loader-syntax.yml
          git add src/features/worker/pages/WorkerIdentityPage.tsx src/features/worker/pages/WorkerWorkHistoryPage.tsx .github/workflows/repair-global-loader-syntax.yml
          git commit -m "fix: repair global loader syntax"
          git push