name: Patch Team Owner Entry Scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx')
          s=p.read_text()
          old="const r=await supabase.from('worker_team_work_entries').select(COLS).eq('team_id',next.team_id).eq('worker_profile_id',next.worker_profile_id).eq('lifecycle_state','active').order('occurred_at',{ascending:false}).order('id',{ascending:false}).limit(100).returns<Entry[]>();"
          new="let entryQuery=supabase.from('worker_team_work_entries').select(COLS).eq('team_id',next.team_id).eq('lifecycle_state','active');if(!next.is_team_owner)entryQuery=entryQuery.eq('worker_profile_id',next.worker_profile_id);const r=await entryQuery.order('occurred_at',{ascending:false}).order('id',{ascending:false}).limit(100).returns<Entry[]>();"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx
          git commit -m "fix: show all team entries to Team Owner"
          git rm .github/workflows/patch-team-owner-entry-scope.yml
          git commit -m "chore: remove temporary Team Owner scope workflow"
          git push
