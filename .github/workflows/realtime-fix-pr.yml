name: Run realtime fix on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reuse realtime patch script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/realtime-fix.yml').read_text()
          marker = "      - name: Patch realtime implementation\n        shell: python\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n\n      - name: Install dependencies and build", start)
          code = workflow[start:end]
          code = textwrap.dedent(code)
          exec(compile(code, 'realtime-fix.yml', 'exec'), {'__name__': '__main__'})

      - name: Install dependencies and build
        run: npm install && npm run build

      - name: Verify final diff scope
        shell: bash
        run: |
          git diff --check
          changed=$(git diff --name-only)
          echo "$changed"
          test -z "$(echo "$changed" | grep -v -E '^(src/app/pages/InboxPage.tsx|src/app/pages/NotificationsPage.tsx|\.github/workflows/realtime-fix(-pr)?\.yml)$')"

      - name: Commit final files and remove temporary automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/realtime-fix.yml .github/workflows/realtime-fix-pr.yml
          git add src/app/pages/InboxPage.tsx src/app/pages/NotificationsPage.tsx .github/workflows/realtime-fix.yml .github/workflows/realtime-fix-pr.yml
          git diff --cached --check
          git commit -m "fix: make inbox and notifications realtime resilient"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
