name: temporary-fix-team-work-version-types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix version snapshot type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx')
          s = p.read_text()
          old = "type Entry={id:string;item_name:string;size:string[]|null;quantity:string|number;rate:string|number;total:string|number;special_note:string|null;occurred_at:string;updated_at?:string;worker_profile_id?:string};"
          new = "type Entry={id:string;item_name:string;size:string[]|null;quantity:string|number;rate:string|number;total:string|number;special_note:string|null;occurred_at:string;updated_at?:string;worker_profile_id?:string};\ntype EntryVersion={id:string;revision_no:number;item_name:string;size:string[]|null;quantity:string|number;rate:string|number;total:string|number;special_note:string|null;recorded_at:string};"
          old_state = "const [versions,setVersions]=useState<Array<{id:string;revision_no:number;item_name:string;quantity:string|number;rate:string|number;total:string|number;recorded_at:string}>>([]);"
          new_state = "const [versions,setVersions]=useState<EntryVersion[]>([]);"
          if old not in s or old_state not in s:
              raise SystemExit('expected source patterns not found')
          s = s.replace(old, new, 1).replace(old_state, new_state, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx .github/workflows/temporary-fix-team-work-version-types.yml
          git rm .github/workflows/temporary-fix-team-work-version-types.yml
          git commit -m 'fix: type Team Work original version fields'
          git push origin HEAD:main
