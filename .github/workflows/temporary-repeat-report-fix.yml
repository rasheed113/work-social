name: Temporary Repeat Contractor Report Fix

on:
  push:
    branches:
      - fix/allow-repeat-contractor-reports

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply repeat contractor report fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allow-repeat-contractor-reports
          fetch-depth: 1
      - name: Patch reported action
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/contractor/pages/ContractorTeamPage.tsx')
          s = p.read_text()
          old = "{!isReported&&<button type=\"button\" className=\"ctd-report-button\" onClick={() => openReport(entry)}>Report this entry</button>}{isReported&&<span className=\"ctd-report-badge\" aria-hidden=\"true\">✓ REPORT LOCKED</span>}"
          new = "<button type=\"button\" className=\"ctd-report-button\" onClick={() => openReport(entry)}>Report this entry</button>"
          if old not in s:
              raise SystemExit('Expected REPORT LOCKED UI fragment was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/contractor/pages/ContractorTeamPage.tsx
          git commit -m 'chore: apply repeat contractor report fix'
          git push