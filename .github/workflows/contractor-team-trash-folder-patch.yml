name: Contractor Team Trash Folder Patch
on:
  push:
    branches: [feat/contractor-team-trash-folder]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/contractor-team-trash-folder
      - name: Add Contractor Team Trash folder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/contractor/pages/ContractorTeamPage.tsx')
          s=p.read_text()
          imp="import { ContractorTeamTrash } from '../components/ContractorTeamTrash';\n"
          if imp not in s:
              s=s.replace("import { supabase } from '../../../lib/supabase/client';\n", "import { supabase } from '../../../lib/supabase/client';\n"+imp)
          state="  const [trashOpen, setTrashOpen] = useState(false);\n"
          if state not in s:
              s=s.replace("  const [addMembersOpen, setAddMembersOpen] = useState(false);\n", "  const [addMembersOpen, setAddMembersOpen] = useState(false);\n"+state)
          button='<button type="button" className="ctd-trash-folder" onClick={() => setTrashOpen(true)} aria-label="Open Team Work Trash"><span aria-hidden="true">🗑️</span><span><b>Trash</b><small>Deleted Team Work</small></span></button>'
          if 'className="ctd-trash-folder"' not in s:
              marker='<div className="ctd-zero-state">Team totals will populate from real member work entries once team-member work linkage is active. No fake totals are shown.</div>'
              s=s.replace(marker, marker+'\n        '+button)
          mount='{trashOpen && <ContractorTeamTrash teamNumber={parsedTeamNumber} onClose={() => setTrashOpen(false)} />}\n'
          if 'ContractorTeamTrash teamNumber={parsedTeamNumber}' not in s:
              s=s.replace('    {membersOpen &&', '    '+mount+'    {membersOpen &&')
          css="""
      .ctd-trash-folder{width:100%;margin-top:9px;min-height:58px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid rgba(255,255,255,.92);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(254,242,242,.94));box-shadow:0 11px 23px rgba(15,23,42,.075),inset 0 1px 0 #fff;color:#172033;cursor:pointer}.ctd-trash-folder span:first-child{font-size:21px}.ctd-trash-folder b{display:block;font-size:11px;font-weight:950}.ctd-trash-folder small{display:block;margin-top:2px;color:#94a3b8;font-size:8px;font-weight:750}
"""
          if '.ctd-trash-folder{' not in s:
              s=s.replace('      .ctd-zero-state{', css+'      .ctd-zero-state{')
          p.write_text(s)
          
          Path('src/features/contractor/components/ContractorTeamTrash.tsx').write_text(r'''import { useEffect, useState } from 'react';
import { supabase } from '../../../lib/supabase/client';

type Props = { teamNumber: number; onClose: () => void };
type TrashEntry = { id:string; item_name:string; size:string[]|null; quantity:number|string; rate:number|string; total:number|string; special_note:string|null; occurred_at:string; updated_at:string; worker_profile_id:string };
type Worker = { id:string; display_name:string|null; username:string|null };

const money=(v:number|string)=>`PKR ${Number(v||0).toLocaleString('en-PK',{maximumFractionDigits:2})}`;
const when=(v:string)=>new Intl.DateTimeFormat('en-PK',{timeZone:'Asia/Karachi',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v));

export function ContractorTeamTrash({teamNumber,onClose}:Props){
 const [entries,setEntries]=useState<TrashEntry[]>([]),[workers,setWorkers]=useState<Record<string,Worker>>({}),[loading,setLoading]=useState(true),[error,setError]=useState(''),[busy,setBusy]=useState<string|null>(null),[confirmId,setConfirmId]=useState<string|null>(null);
 const load=async()=>{setLoading(true);setError('');const r=await supabase.rpc('get_worker_team_work_trash',{p_team_number:teamNumber});if(r.error){setError(r.error.message);setLoading(false);return}const rows=(r.data??[]) as TrashEntry[];setEntries(rows);const ids=[...new Set(rows.map(x=>x.worker_profile_id))];if(ids.length){const w=await supabase.from('worker_profiles').select('id,profile_id').in('id',ids);const profileIds=(w.data??[]).map((x:{id:string;profile_id:string})=>x.profile_id);if(profileIds.length){const p=await supabase.from('profiles').select('id,display_name,username').in('id',profileIds);const byProfile=new Map((p.data??[]).map((x:Worker)=>[x.id,x]));const mapped:Record<string,Worker>={};for(const x of (w.data??[]) as {id:string;profile_id:string}[])mapped[x.id]=byProfile.get(x.profile_id)??{id:x.profile_id,display_name:null,username:null};setWorkers(mapped)}}setLoading(false)};
 useEffect(()=>{void load()},[teamNumber]);
 const restore=async(id:string)=>{setBusy(id);const r=await supabase.rpc('restore_worker_team_work_entry',{p_entry_id:id});setBusy(null);if(r.error)setError(r.error.message);else await load()};
 const purge=async(id:string)=>{setBusy(id);const r=await supabase.rpc('delete_worker_team_work_entry_permanently',{p_entry_id:id});setBusy(null);setConfirmId(null);if(r.error)setError(r.error.message);else await load()};
 return <div className="ctd-panel-backdrop" role="presentation" onMouseDown={e=>{if(e.currentTarget===e.target)onClose()}}><section className="ctd-panel ctt-panel" role="dialog" aria-modal="true" aria-label="Team Work Trash"><div className="ctd-panel-head"><div><div className="ctd-panel-title">🗑️ TEAM WORK TRASH</div><div className="ctt-sub">Owner control · Deleted entries remain recoverable</div></div><button type="button" className="ctd-close" onClick={onClose}>×</button></div>{loading?<div className="ctd-member-empty">Loading real deleted Team Work…</div>:error?<div className="ctd-member-empty ctt-error">{error}</div>:!entries.length?<div className="ctd-member-empty">Trash is empty.</div>:<div className="ctt-list">{entries.map(e=>{const w=workers[e.worker_profile_id];return <article className="ctt-card" key={e.id}><div className="ctt-row"><div><div className="ctt-name">{e.item_name}</div><div className="ctt-worker">Worker · {w?.display_name||w?.username||'Worker'}</div></div><div className="ctt-amount">{money(e.total)}</div></div><div className="ctt-meta">Deleted from active work · Qty {e.quantity} · Rate {e.rate} · {when(e.updated_at)}</div>{e.special_note&&<div className="ctt-note">{e.special_note}</div>}<div className="ctt-actions"><button type="button" className="ctt-restore" disabled={busy===e.id} onClick={()=>void restore(e.id)}>↶ Restore</button><button type="button" className="ctt-delete" disabled={busy===e.id} onClick={()=>setConfirmId(e.id)}>Permanently Delete</button></div></article>})}</div>}{confirmId&&<div className="ctt-confirm"><div className="ctt-confirm-icon">⚠️</div><strong>Permanently remove this entry?</strong><p>This cannot be undone and the entry will be removed from Team Work history.</p><div><button type="button" onClick={()=>setConfirmId(null)} className="ctt-cancel">Cancel</button><button type="button" onClick={()=>void purge(confirmId)} className="ctt-delete">Delete Permanently</button></div></div>}</section><style>{`.ctt-sub{margin-top:3px;color:#94a3b8;font-size:8px;font-weight:750}.ctt-list{display:grid;gap:8px;max-height:62vh;overflow:auto}.ctt-card{padding:12px;border-radius:15px;border:1px solid rgba(226,232,240,.9);background:linear-gradient(145deg,#fff,#fff7f7);box-shadow:0 7px 16px rgba(15,23,42,.055)}.ctt-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ctt-name{font-size:12px;font-weight:950}.ctt-worker{margin-top:3px;color:#64748b;font-size:8px;font-weight:800}.ctt-amount{font-size:13px;font-weight:950;color:#b91c1c}.ctt-meta{margin-top:8px;color:#64748b;font-size:8px;line-height:1.45}.ctt-note{margin-top:7px;padding:7px 8px;border-radius:9px;background:#f8fafc;color:#475569;font-size:8px}.ctt-actions{display:flex;gap:6px;margin-top:9px}.ctt-actions button,.ctt-confirm button{min-height:34px;padding:0 9px;border-radius:9px;font-size:8px;font-weight:950;cursor:pointer}.ctt-restore{border:1px solid rgba(16,185,129,.25);background:#ecfdf5;color:#047857}.ctt-delete{border:0;background:#dc2626;color:#fff}.ctt-error{color:#b91c1c}.ctt-confirm{position:absolute;left:15px;right:15px;bottom:15px;padding:13px;border-radius:15px;background:#fff;border:1px solid rgba(254,202,202,.9);box-shadow:0 20px 45px rgba(15,23,42,.18)}.ctt-confirm-icon{font-size:20px}.ctt-confirm strong{display:block;margin-top:5px;font-size:11px}.ctt-confirm p{margin:4px 0 10px;color:#64748b;font-size:8px;line-height:1.45}.ctt-confirm>div:last-child{display:flex;gap:6px}.ctt-cancel{border:1px solid #e2e8f0;background:#fff;color:#475569}`}</style></div>;
}
''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/contractor/pages/ContractorTeamPage.tsx src/features/contractor/components/ContractorTeamTrash.tsx .github/workflows/contractor-team-trash-folder-patch.yml
          git commit -m "feat: add contractor Team Dashboard trash folder" || true
          git push origin feat/contractor-team-trash-folder
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/contractor-team-trash-folder-patch.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary contractor trash patch workflow" || true
          git push origin feat/contractor-team-trash-folder || true
