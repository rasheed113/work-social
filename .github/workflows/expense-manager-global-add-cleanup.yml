name: Expense Manager global Add cleanup

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  cleanup:
    if: github.event.pull_request.base.ref == 'main' && (github.event.pull_request.number == 44 || startsWith(github.event.pull_request.head.ref, 'codex/expense-manager-global-add-cleanup'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove page-level Add buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'src/features/expense-manager/pages/ExpenseAccountsPage.tsx',
              'src/features/expense-manager/pages/ExpenseCategoriesPage.tsx',
              'src/features/expense-manager/pages/ExpenseBudgetsPage.tsx',
              'src/features/expense-manager/pages/ExpenseTransactionsPage.tsx',
              'src/features/expense-manager/components/ExpenseOverviewDashboard.tsx',
          ]

          classes = {
              'ExpenseAccountsPage.tsx': 'expense-accounts__add',
              'ExpenseCategoriesPage.tsx': 'expense-categories__add',
              'ExpenseBudgetsPage.tsx': 'expense-budgets__add',
              'ExpenseTransactionsPage.tsx': 'expense-transactions__add',
              'ExpenseOverviewDashboard.tsx': 'expense-overview__add',
          }

          for name in files:
              path = Path(name)
              text = path.read_text()
              original = text
              cls = re.escape(classes[path.name])
              text = re.sub(rf'<button\s+type="button"\s+className="{cls}"[\s\S]*?</button>', '', text)
              text = re.sub(rf'\.{cls}\{{[^}}]*\}}', '', text)
              text = re.sub(rf'\.{cls}::after\{{[^}}]*\}}', '', text)
              if text != original:
                  path.write_text(text)
          PY

      - name: Validate diff
        run: git diff --check

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/expense-manager/pages src/features/expense-manager/components/ExpenseOverviewDashboard.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Remove redundant Expense Manager page Add buttons'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
