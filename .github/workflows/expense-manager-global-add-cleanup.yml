name: Expense Manager global Add cleanup

on:
  push:
    branches:
      - codex/expense-manager-remove-duplicate-add-actions
      - codex/expense-manager-overview-remove-duplicate-add
      - codex/expense-manager-global-add-cleanup

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove page-level Add buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'src/features/expense-manager/pages/ExpenseAccountsPage.tsx',
              'src/features/expense-manager/pages/ExpenseCategoriesPage.tsx',
              'src/features/expense-manager/pages/ExpenseBudgetsPage.tsx',
              'src/features/expense-manager/pages/ExpenseTransactionsPage.tsx',
              'src/features/expense-manager/components/ExpenseOverviewDashboard.tsx',
          ]

          for name in files:
              path = Path(name)
              text = path.read_text()
              original = text
              cls = re.escape({
                  'ExpenseAccountsPage.tsx': 'expense-accounts__add',
                  'ExpenseCategoriesPage.tsx': 'expense-categories__add',
                  'ExpenseBudgetsPage.tsx': 'expense-budgets__add',
                  'ExpenseTransactionsPage.tsx': 'expense-transactions__add',
                  'ExpenseOverviewDashboard.tsx': 'expense-overview__add',
              }[path.name])

              # Remove every page-level Add button, including empty-state CTAs.
              text = re.sub(
                  rf'<button\s+type="button"\s+className="{cls}"[\s\S]*?</button>',
                  '', text,
              )

              # Remove the now-unused Add CSS rule. Also remove the mobile rule when present.
              text = re.sub(rf'\.{cls}\{{[^}}]*\}}', '', text)
              text = re.sub(rf'\.{cls}::after\{{[^}}]*\}}', '', text)

              if text != original:
                  path.write_text(text)

          PY

      - name: Validate diff
        run: git diff --check

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/expense-manager/pages src/features/expense-manager/components/ExpenseOverviewDashboard.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Remove redundant Expense Manager page Add buttons'
          git push origin HEAD:${{ github.ref_name }}
