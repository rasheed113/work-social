name: Expense Manager global Add cleanup

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  cleanup:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.number == 45
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove page-level Add buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = {
            'src/features/expense-manager/pages/ExpenseAccountsPage.tsx': [r'<button\b[^>]*className="expense-accounts__add"[^>]*>[\s\S]*?</button>', r'<button\b[^>]*onClick=\{openAdd\}[^>]*>[\s\S]*?</button>'],
            'src/features/expense-manager/pages/ExpenseCategoriesPage.tsx': [r'<button\b[^>]*className="expense-categories__add"[^>]*>[\s\S]*?</button>', r'<button\b[^>]*onClick=\{openAdd\}[^>]*>[\s\S]*?</button>'],
            'src/features/expense-manager/pages/ExpenseBudgetsPage.tsx': [r'<button\b[^>]*className="expense-budgets__add"[^>]*>[\s\S]*?</button>', r'<button\b[^>]*onClick=\{openAdd\}[^>]*>[\s\S]*?</button>'],
            'src/features/expense-manager/pages/ExpenseTransactionsPage.tsx': [r'<button\b[^>]*className="expense-transactions__add"[^>]*>[\s\S]*?</button>', r'<button\b[^>]*onClick=\{openAdd\}[^>]*>[\s\S]*?</button>'],
            'src/features/expense-manager/components/ExpenseOverviewDashboard.tsx': [r'<button\b[^>]*className="expense-overview__add"[^>]*>[\s\S]*?</button>', r'<button\b[^>]*onClick=\{\(\) => onNavigate\(\x27/expense-manager/transactions\?intent=add\x27\)\}[^>]*>[\s\S]*?</button>'],
          }
          for name, patterns in targets.items():
            path = Path(name)
            text = path.read_text()
            for pattern in patterns:
              text = re.sub(pattern, '', text)
            text = re.sub(r'\.expense-[a-z-]+__add(?::after)?\{[^{}]*\}', '', text)
            text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
            path.write_text(text)
          PY
          npm install
          npm run build
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/expense-manager/pages src/features/expense-manager/components/ExpenseOverviewDashboard.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove redundant Expense Manager page Add buttons'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
