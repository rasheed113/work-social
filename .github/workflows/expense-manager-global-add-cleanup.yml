name: Expense Manager global Add cleanup

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  cleanup:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.number == 45
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove page-level Add buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = {
            'src/features/expense-manager/pages/ExpenseAccountsPage.tsx': ('accounts', 'account', '＋ Add account'),
            'src/features/expense-manager/pages/ExpenseCategoriesPage.tsx': ('categories', 'category', '＋ Add category'),
            'src/features/expense-manager/pages/ExpenseBudgetsPage.tsx': ('budgets', 'budget', '＋ Add budget'),
            'src/features/expense-manager/pages/ExpenseTransactionsPage.tsx': ('transactions', 'transaction', '＋ Add transaction'),
          }
          for name, (key, noun, label) in targets.items():
            path = Path(name)
            text = path.read_text()
            cls = f'expense-{key}__add'
            wrapper = r'\{\s*' + key + r'\.length\s*>\s*0\s*&&\s*\(\s*<button\b[^>]*className="' + re.escape(cls) + r'"[\s\S]*?</button>\s*\)\s*\}'
            text = re.sub(wrapper, '', text)
            text = text.replace('<button type="button" className="' + cls + '" onClick={openAdd}><span>' + label + '</span></button>', '')
            text = text.replace('<button type="button" className="' + cls + '" onClick={openAdd} aria-label="Add ' + noun + '"><span>' + label + '</span></button>', '')
            text = text.replace('<button type="button" className="expense-' + key + '__empty-action" onClick={openAdd}>' + label + '</button>', '')
            text = re.sub(r'\.expense-' + re.escape(key) + r'__add(?::after)?\{[^{}]*\}', '', text)
            text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
            path.write_text(text)

          path = Path('src/features/expense-manager/components/ExpenseOverviewDashboard.tsx')
          text = path.read_text()
          text = re.sub(r'<button\b[^>]*className="expense-overview__add"[^>]*>[\s\S]*?</button>', '', text)
          text = text.replace('<button type="button" className="expense-overview__add" onClick={() => onNavigate(\'/expense-manager/transactions?intent=add\')}>＋ Add transaction</button>', '')
          text = re.sub(r'\.expense-overview__add(?::after)?\{[^{}]*\}', '', text)
          text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
          path.write_text(text)
          PY
          npm install
          npm run build
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/expense-manager/pages src/features/expense-manager/components/ExpenseOverviewDashboard.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove redundant Expense Manager page Add buttons'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
