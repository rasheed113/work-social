name: Patch contractor history cards
on:
  push:
    branches:
      - feat/contractor-team-dashboard-history-cards
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contractor-team-dashboard-history-cards
          fetch-depth: 1
      - name: Patch dashboard cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/contractor/pages/ContractorTeamPage.tsx')
          s = p.read_text()
          old = 'function SummaryCard({ label, value, caption, icon }: SummaryCardProps) { return <article className="ctd-summary-card"><div className="ctd-card-icon" aria-hidden="true">{icon}</div><div className="ctd-card-label">{label}</div><div className="ctd-card-value">{value}</div><div className="ctd-card-caption">{caption}</div></article>; }'
          new = 'function SummaryCard({ label, value, caption, icon, onClick }: SummaryCardProps & { onClick: () => void }) { return <button type="button" className="ctd-summary-card" onClick={onClick} aria-label={`${label} Team Work history`}><div className="ctd-card-icon" aria-hidden="true">{icon}</div><div className="ctd-card-label">{label}</div><div className="ctd-card-value">{value}</div><div className="ctd-card-caption">{caption}</div><span className="ctd-card-open" aria-hidden="true">› History</span></button>; }'
          if old not in s: raise SystemExit('SummaryCard source pattern not found')
          s = s.replace(old, new, 1)
          old = '  const parsedTeamNumber = useMemo(() => Number(teamNumber), [teamNumber]);'
          new = '''  const parsedTeamNumber = useMemo(() => Number(teamNumber), [teamNumber]);
  const [historyPeriod, setHistoryPeriod] = useState<'today' | 'weekly' | 'monthly' | 'lifetime' | null>(null);
  const historyEntries = useMemo(() => {
    if (!historyPeriod) return [];
    const now = new Date();
    const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekStart = new Date(dayStart);
    weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const start = historyPeriod === 'today' ? dayStart : historyPeriod === 'weekly' ? weekStart : historyPeriod === 'monthly' ? monthStart : null;
    return entries.filter(entry => !start || new Date(entry.occurred_at) >= start).sort((a, b) => new Date(b.occurred_at).getTime() - new Date(a.occurred_at).getTime());
  }, [entries, historyPeriod]);
  const historyTotal = useMemo(() => historyEntries.reduce((sum, entry) => sum + Number(entry.total || 0), 0), [historyEntries]);
  const historyTitle = historyPeriod === 'today' ? 'Today History' : historyPeriod === 'weekly' ? 'Weekly History' : historyPeriod === 'monthly' ? 'Monthly History' : 'Complete Team Work History';
  const openHistory = (period: 'today' | 'weekly' | 'monthly' | 'lifetime') => setHistoryPeriod(period);
'''
          if old not in s: raise SystemExit('state anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('.ctd-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ctd-summary-card{min-height:105px;box-sizing:border-box;padding:11px 12px;', '.ctd-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.ctd-summary-card{position:relative;min-height:82px;box-sizing:border-box;padding:8px 9px;', 1)
          s = s.replace('.ctd-card-icon{width:27px;height:27px;', '.ctd-card-icon{width:23px;height:23px;', 1)
          s = s.replace('.ctd-card-label{margin-top:8px;', '.ctd-card-label{margin-top:5px;', 1)
          s = s.replace('.ctd-card-value{margin-top:2px;color:#172033;font-size:17px;', '.ctd-card-value{margin-top:1px;color:#172033;font-size:15px;', 1)
          s = s.replace('.ctd-card-caption{margin-top:2px;color:#94a3b8;font-size:8px;', '.ctd-card-caption{margin-top:1px;color:#94a3b8;font-size:7px;', 1)
          anchor = '.ctd-work-error{margin-top:8px;'
          s = s.replace(anchor, '.ctd-card-open{position:absolute;right:8px;bottom:7px;color:#0f766e;font-size:6px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}.ctd-summary-card:hover,.ctd-summary-card:focus-visible{transform:translateY(-1px);border-color:rgba(15,118,110,.28);box-shadow:0 14px 25px rgba(15,23,42,.11),inset 0 1px 0 #fff}.ctd-summary-card:focus-visible{outline:2px solid rgba(79,70,229,.32);outline-offset:2px}.ctd-history-modal{width:min(620px,100%);max-height:min(78dvh,720px);overflow:auto;padding:17px;border:1px solid rgba(255,255,255,.96);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.99),rgba(236,253,245,.98) 52%,rgba(239,246,255,.98));box-shadow:0 32px 90px rgba(15,23,42,.28),inset 0 1px 0 #fff}.ctd-history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ctd-history-kicker{font-size:8px;font-weight:950;letter-spacing:.15em;color:#0f766e;text-transform:uppercase}.ctd-history-title{margin:5px 0 0;font-size:21px;font-weight:950;letter-spacing:-.04em}.ctd-history-summary{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;background:linear-gradient(145deg,rgba(236,253,245,.94),rgba(238,242,255,.9));border:1px solid rgba(15,118,110,.12)}.ctd-history-summary strong{font-size:17px}.ctd-history-summary span{color:#64748b;font-size:8px;font-weight:850}.ctd-history-list{display:grid;gap:7px;margin-top:10px}.ctd-history-item{padding:10px 11px;border-radius:14px;border:1px solid rgba(148,163,184,.13);background:rgba(255,255,255,.82);box-shadow:0 7px 16px rgba(15,23,42,.05)}.ctd-history-item-top{display:flex;justify-content:space-between;gap:8px}.ctd-history-item-name{font-size:10px;font-weight:950}.ctd-history-item-total{font-size:10px;font-weight:950;white-space:nowrap}.ctd-history-item-meta{margin-top:4px;color:#64748b;font-size:7px}.ctd-history-item-worker{margin-top:5px;color:#0f766e;font-size:7px;font-weight:900}.ctd-history-empty{margin-top:10px;padding:18px 10px;text-align:center;border:1px dashed rgba(100,116,139,.2);border-radius:14px;color:#64748b;font-size:9px}.ctd-work-error{margin-top:8px;', 1)
          old = '<section className="ctd-summary-grid" aria-label="Team work summary"><SummaryCard label="Today" value={money(totals?.daily_total ?? 0)} caption={totals?.entry_count ? `${totals.entry_count} active team entries` : \'No member work recorded yet\'} icon="◷"/><SummaryCard label="Weekly" value={money(totals?.weekly_total ?? 0)} caption="Active member Team Work" icon="▥"/><SummaryCard label="Monthly" value={money(totals?.monthly_total ?? 0)} caption="Active member Team Work" icon="◫"/><SummaryCard label="Grand Total" value={money(totals?.lifetime_total ?? 0)} caption="All active Team Work" icon="◆"/></section>'
          new = '<section className="ctd-summary-grid" aria-label="Team work summary"><SummaryCard label="Today" value={money(totals?.daily_total ?? 0)} caption="Tap for today history" icon="◷" onClick={() => openHistory(\'today\')}/><SummaryCard label="Weekly" value={money(totals?.weekly_total ?? 0)} caption="Tap for weekly history" icon="▥" onClick={() => openHistory(\'weekly\')}/><SummaryCard label="Monthly" value={money(totals?.monthly_total ?? 0)} caption="Tap for monthly history" icon="◫" onClick={() => openHistory(\'monthly\')}/><SummaryCard label="Grand Total" value={money(totals?.lifetime_total ?? 0)} caption="Tap for complete history" icon="◆" onClick={() => openHistory(\'lifetime\')}/></section>'
          if old not in s: raise SystemExit('summary grid pattern not found')
          s = s.replace(old, new, 1)
          modal = '''{historyPeriod && <div className="ctd-panel-backdrop" role="presentation" onMouseDown={e => { if(e.currentTarget===e.target)setHistoryPeriod(null); }}><section className="ctd-history-modal" role="dialog" aria-modal="true" aria-labelledby="ctd-history-title"><div className="ctd-history-head"><div><div className="ctd-history-kicker">PREMIUM TEAM WORK HISTORY</div><h2 className="ctd-history-title" id="ctd-history-title">{historyTitle}</h2></div><button type="button" className="ctd-close" onClick={() => setHistoryPeriod(null)} aria-label="Close history">×</button></div><div className="ctd-history-summary"><div><strong>{money(historyTotal)}</strong><span>{historyEntries.length} real Team Work {historyEntries.length === 1 ? 'entry' : 'entries'}</span></div><span>{historyPeriod === 'lifetime' ? 'ALL ACTIVE HISTORY' : historyPeriod.toUpperCase()}</span></div>{historyEntries.length ? <div className="ctd-history-list">{historyEntries.map(entry => <article className="ctd-history-item" key={entry.id}><div className="ctd-history-item-top"><div className="ctd-history-item-name">{entry.item_name.replace(/ · REPORTED/g,'').replace(/ · Edited$/,'')}</div><div className="ctd-history-item-total">{money(entry.total)}</div></div><div className="ctd-history-item-meta">{entry.size?.join(' × ') || 'No size'} · {entry.quantity} pcs · {formatDate(entry.occurred_at)}</div><div className="ctd-history-item-worker">Worker · {workerName(entry)}{entry.item_name.includes(' · REPORTED') ? ' · REPORTED' : ''}{entry.item_name.endsWith(' · Edited') ? ' · EDITED' : ''}</div></article>)}</div> : <div className="ctd-history-empty">No active Team Work entries exist in this period.</div>}</section></div>}'''
          marker = '  {trashOpen &&'
          if marker not in s: raise SystemExit('modal marker not found')
          s = s.replace(marker, '  ' + modal + '\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/contractor/pages/ContractorTeamPage.tsx .github/workflows/patch-team-history-cards.yml
          git commit -m "feat: add clickable contractor history cards" --allow-empty
          git rm .github/workflows/patch-team-history-cards.yml
          git commit -m "chore: remove temporary history patch workflow"
          git push origin feat/contractor-team-dashboard-history-cards
