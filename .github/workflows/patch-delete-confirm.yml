name: Patch Team Work delete confirmation
on:
  push:
    branches: [feat/team-work-premium-delete-confirmation]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch confirmation UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx')
          s=p.read_text()
          s=s.replace("const [showTrash,setShowTrash]=useState(false);const [versions", "const [showTrash,setShowTrash]=useState(false);const [confirmingDelete,setConfirmingDelete]=useState<string|null>(null);const [versions", 1)
          s=s.replace("const remove=async(id:string)=>{if(!window.confirm('Move this entry to Trash? It will leave active totals and stay recoverable by the Team Owner.'))return;setBusy(id);const r=await supabase.rpc('trash_worker_team_work_entry',{p_entry_id:id});setBusy(null);if(r.error)setError(r.error.message);else await load()};", "const remove=async(id:string)=>{setConfirmingDelete(id)};\n const confirmRemove=async()=>{if(!confirmingDelete)return;const id=confirmingDelete;setConfirmingDelete(null);setBusy(id);const r=await supabase.rpc('trash_worker_team_work_entry',{p_entry_id:id});setBusy(null);if(r.error)setError(r.error.message);else await load()};", 1)
          marker=" {showTrash&&<div className=\"twd-modal-backdrop\">"
          modal=" {confirmingDelete&&<div className=\"twd-modal-backdrop\"><section className=\"twd-modal\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"twd-delete-title\"><div style={{width:46,height:46,borderRadius:15,display:'grid',placeItems:'center',background:'linear-gradient(145deg,#fff1f2,#ffe4e6)',color:'#e11d48',boxShadow:'0 10px 22px #e11d481c'}} aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"1.9\" strokeLinecap=\"round\" strokeLinejoin=\"round\"><path d=\"M12 3 2.8 19a1.5 1.5 0 0 0 1.3 2.2h15.8a1.5 1.5 0 0 0 1.3-2.2L12 3Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/></svg></div><div className=\"twd-kicker\" style={{marginTop:10}}>MOVE TO TRASH</div><h3 id=\"twd-delete-title\">Move this entry to Trash?</h3><p className=\"twd-copy\">This entry will leave active Team Work totals immediately and remain safely recoverable until the Team Owner restores it or permanently removes it.</p><div className=\"twd-modal-actions\"><button type=\"button\" className=\"twd-button\" disabled={!!busy} onClick={()=>setConfirmingDelete(null)}>Cancel</button><button type=\"button\" className=\"twd-button\" style={{background:'linear-gradient(145deg,#fb7185,#e11d48)',color:'#fff',borderColor:'#be123c55'}} disabled={!!busy} onClick={()=>void confirmRemove()}>{busy?'Moving…':'Move to Trash'}</button></div></section></div>}\n"
          if marker not in s: raise SystemExit('trash modal marker not found')
          s=s.replace(marker, modal+marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-delete-confirm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx .github/workflows/patch-delete-confirm.yml
          git commit -m 'feat: replace Team Work delete warning with premium modal'
          git push origin HEAD:feat/team-work-premium-delete-confirmation
