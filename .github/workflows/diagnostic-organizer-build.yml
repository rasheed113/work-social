name: Diagnostic Organizer Build
on:
  push:
    branches:
      - feat-worker-diary-organizer-final
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Capture build diagnostics
        run: |
          set +e
          npm run build > build-diagnostic.log 2>&1
          status=$?
          echo "BUILD_EXIT_CODE=$status" >> build-diagnostic.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-diagnostic.log
          git commit -m "chore: capture Organizer build diagnostics" || true
          git push origin HEAD:feat-worker-diary-organizer-final
