name: finance-overpayment-patch-auto
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final payment allocation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/contractor/pages/ContractorTeamFinancePage.tsx')
          s=p.read_text()
          old="for(const id of ids){if(remainingPayment<=0)break;const payable=payables.find(p=>p.id===id);const allocation=Math.min(remainingPayment,Number(payable?.remaining||0));"
          new="for(const [index,id] of ids.entries()){if(remainingPayment<=0)break;const payable=payables.find(p=>p.id===id);const allocation=index===ids.length-1?remainingPayment:Math.min(remainingPayment,Number(payable?.remaining||0));"
          if old not in s:
              raise SystemExit('target allocation loop not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/contractor/pages/ContractorTeamFinancePage.tsx
          git commit -m 'fix: allow final team finance payment to create advance'
          git push origin main
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/__finance_overpayment_patch_auto.yml .github/workflows/__finance_overpayment_patch.yml || true
          git commit -m 'chore: remove temporary finance patch workflows' || true
          git push origin main || true
