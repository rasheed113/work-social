name: Find loading UI
on:
  push:
    branches:
      - fix/worker-personal-finance-redesign
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate loading UI
        run: |
          git grep -n -E "Opening|Checking approved|Checking|approved" -- ':!docs/loading-ui-location.txt' > docs/loading-ui-location.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/loading-ui-location.txt
          git commit -m "chore: record loading UI location"
          git push
