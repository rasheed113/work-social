name: Cleanup loading report
on:
  push:
    branches:
      - fix/worker-personal-finance-redesign
permissions:
  contents: write
jobs:
  cleanup:
    if: "${{ !contains(github.event.head_commit.message, 'cleanup loading report') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary files
        run: |
          rm -f docs/loading-ui-location.txt .github/workflows/cleanup-loading-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: cleanup loading report"
          git push
