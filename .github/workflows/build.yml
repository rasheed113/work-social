name: build
on:
  push:
    branches: [main, feat/ai-universal-eyes-phase-2, feat/team-finance-audit-history-pagination]
  pull_request:
    branches: [main, feat/worker-work-entry-phase-3c]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair Team Finance audit history
        run: |
          git fetch origin feat/team-finance-audit-history-pagination
          git checkout -B feat/team-finance-audit-history-pagination origin/feat/team-finance-audit-history-pagination
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/contractor/pages/ContractorTeamFinancePage.tsx')
          s=p.read_text()
          old="const refreshDetail=async()=>{if(!selected||!mode)return;const b=bounds(detailPeriod),f=await supabase.rpc('get_contractor_team_worker_finance',{p_team_number:Number(teamNumber),p_worker_profile_id:selected.worker_profile_id,p_start:b.start,p_end:b.end});if(f.error){setError(f.error.message);return}setDetail((f.data?.[0] as Finance)||zero);const t=await supabase.from('contractor_teams').select('id').eq('team_number',Number(teamNumber)).maybeSingle();if(t.data){const e=await supabase.from('worker_team_work_entries').select('id').eq('team_id',t.data.id).eq('worker_profile_id',selected.worker_profile_id);const ids=(e.data||[]).map((x:any)=>x.id);if(ids.length){const a=await supabase.from('worker_team_work_entry_versions').select('id,work_entry_id,revision_no,item_name,size,quantity,rate,total,special_note,recorded_at,changed_by').in('work_entry_id',ids).gte('recorded_at',b.start).lt('recorded_at',b.end).order('recorded_at',{ascending:false}).order('id',{ascending:false});if(!a.error)setAudits((a.data||[]) as Audit[])}}if(mode==='payment'){const h=await supabase.rpc('get_contractor_team_worker_payment_history',{p_team_number:Number(teamNumber),p_worker_profile_id:selected.worker_profile_id,p_start:b.start,p_end:b.end});if(!h.error)setPayments((h.data||[]) as Payment[])}else{const h=await supabase.rpc('get_contractor_team_worker_work_history',{p_team_number:Number(teamNumber),p_worker_profile_id:selected.worker_profile_id,p_start:b.start,p_end:b.end});if(!h.error)setWorks((h.data||[]) as Work[])}};"
          new="const refreshDetail=async()=>{if(!selected||!mode)return;const b=bounds(detailPeriod),f=await supabase.rpc('get_contractor_team_worker_finance',{p_team_number:Number(teamNumber),p_worker_profile_id:selected.worker_profile_id,p_start:b.start,p_end:b.end});if(f.error){setError(f.error.message);return}setDetail((f.data?.[0] as Finance)||zero);if(mode==='audit'){setAudits([]);const t=await supabase.from('contractor_teams').select('id').eq('team_number',Number(teamNumber)).maybeSingle();if(t.error){setError(t.error.message);return}if(!t.data)return;const e=await supabase.from('worker_team_work_entries').select('id').eq('team_id',t.data.id).eq('worker_profile_id',selected.worker_profile_id);if(e.error){setError(e.error.message);return}const ids=(e.data||[]).map((x:any)=>x.id);if(!ids.length)return;const a=await supabase.from('worker_team_work_entry_versions').select('id,work_entry_id,revision_no,item_name,size,quantity,rate,total,special_note,recorded_at,changed_by').in('work_entry_id',ids).gte('recorded_at',b.start).lt('recorded_at',b.end).order('recorded_at',{ascending:false}).order('id',{ascending:false});if(a.error){setError(a.error.message);return}setAudits((a.data||[]) as Audit[]);return}if(mode==='payment'){const h=await supabase.rpc('get_contractor_team_worker_payment_history',{p_team_number:Number(teamNumber),p_worker_profile_id:selected.worker_profile_id,p_start:b.start,p_end:b.end});if(!h.error)setPayments((h.data||[]) as Payment[])}else{const h=await supabase.rpc('get_contractor_team_worker_work_history',{p_team_number:Number(teamNumber),p_worker_profile_id:selected.worker_profile_id,p_start:b.start,p_end:b.end});if(!h.error)setWorks((h.data||[]) as Work[])}};"
          if old not in s: raise SystemExit('refreshDetail target not found')
          s=s.replace(old,new,1)
          s=s.replace("<button className=\"tf-btn audit\" onClick={()=>void open(w,'audit')}","<button className=\"tf-btn audit\" onClick={()=>void open(w,'audit')}",1)
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-team-finance-audit.yml README_AUDIT_TMP.md
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Persist repaired source and restore workflow
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/build.yml
          git add src/features/contractor/pages/ContractorTeamFinancePage.tsx
          git add -u .github/workflows/build.yml .github/workflows/repair-team-finance-audit.yml README_AUDIT_TMP.md
          git commit -m 'fix: harden team finance audit history' || exit 0
          git push origin HEAD:feat/team-finance-audit-history-pagination
