name: build
on:
  push:
    branches: [main, feat/ai-universal-eyes-phase-2, feat/contractor-overview-disco-pulse-ribbon]
  pull_request:
    branches: [main, feat/worker-work-entry-phase-3c]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
