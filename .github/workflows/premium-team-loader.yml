name: Premium team loading UI
on:
  push:
    branches:
      - fix/worker-personal-finance-redesign
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'feat(worker): premium team dashboard loading UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace plain team loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('src/features/worker/pages/WorkerTeamDashboardPage.tsx'),Path('src/features/worker/pages/WorkerTeamDashboardWorkPage.tsx'),Path('src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx')]
          loader_css='''`.ws-page-loader{min-height:calc(100dvh - 82px);display:grid;place-items:center;box-sizing:border-box;padding:28px 18px 112px;background:radial-gradient(circle at 18% 12%,rgba(34,193,220,.18),transparent 30%),radial-gradient(circle at 84% 78%,rgba(109,93,252,.2),transparent 34%),linear-gradient(145deg,#07111f,#101a31 52%,#0a1721);color:#f8fafc;overflow:hidden}.ws-page-loader-card{position:relative;width:min(360px,100%);padding:28px 24px 24px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.045));box-shadow:0 28px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);text-align:center;overflow:hidden}.ws-page-loader-card:before{content:'';position:absolute;inset:-45%;background:radial-gradient(circle,rgba(34,193,220,.13),transparent 42%);animation:ws-loader-glow 3.4s ease-in-out infinite;pointer-events:none}.ws-page-loader-mark{position:relative;width:68px;height:68px;margin:0 auto 19px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:22px;background:linear-gradient(145deg,#8ff3ff 0%,#3b82f6 46%,#6d3fe8 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.45),0 14px 34px rgba(37,99,235,.3);font-size:20px;font-weight:950;letter-spacing:-.08em}.ws-page-loader-mark:after{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.2);border-radius:17px;animation:ws-loader-ring 2s linear infinite}.ws-page-loader-title{position:relative;margin:0;font-size:20px;line-height:1.15;font-weight:900;letter-spacing:-.035em}.ws-page-loader-copy{position:relative;margin:8px 0 0;color:rgba(191,219,254,.78);font-size:11px;line-height:1.5}.ws-page-loader-track{position:relative;height:5px;margin:20px 0 0;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.ws-page-loader-track:after{content:'';position:absolute;inset:0;width:42%;border-radius:inherit;background:linear-gradient(90deg,#22c1dc,#6d5dfc,#8ff3ff);box-shadow:0 0 16px rgba(34,193,220,.45);animation:ws-loader-progress 1.55s ease-in-out infinite}.ws-page-loader-status{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:11px;color:rgba(226,232,240,.66);font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.ws-page-loader-status i{width:6px;height:6px;border-radius:50%;background:#22c1dc;box-shadow:0 0 10px rgba(34,193,220,.8);animation:ws-loader-pulse 1.2s ease-in-out infinite}@keyframes ws-loader-ring{to{transform:rotate(360deg)}}@keyframes ws-loader-progress{0%{transform:translateX(-115%)}60%,100%{transform:translateX(245%)}}@keyframes ws-loader-pulse{50%{opacity:.35;transform:scale(.72)}}@keyframes ws-loader-glow{50%{transform:scale(1.08);opacity:.72}}@media(max-width:480px){.ws-page-loader-card{padding:25px 19px 22px;border-radius:24px}.ws-page-loader-mark{width:62px;height:62px;border-radius:19px}.ws-page-loader-title{font-size:18px}}`'''
          def premium(title, copy, status, wrapper):
              return f'''{wrapper}<section className="ws-page-loader" aria-live="polite"><style>{{{loader_css}}}</style><div className="ws-page-loader-card"><div className="ws-page-loader-mark" aria-hidden="true">WS</div><h1 className="ws-page-loader-title">{title}</h1><p className="ws-page-loader-copy">{copy}</p><div className="ws-page-loader-track" aria-hidden="true"/><div className="ws-page-loader-status"><i/> {status}</div></div></section></main>;'''
          targets = {
            'src/features/worker/pages/WorkerTeamDashboardPage.tsx': ('if (loading) return <main className="team-dashboard-page"><div className="td-state"><strong>Opening Team Dashboard…</strong><p>Checking your approved membership for this team.</p></div></main>;', premium('Opening Team Dashboard','Checking your approved membership for this team.','Securing your workspace','if (loading) return <main className="team-dashboard-page">')),
            'src/features/worker/pages/WorkerTeamDashboardWorkPage.tsx': ('if (loading) return <main className="twd"><section className="twd-state"><strong>Opening Team Dashboard…</strong><p>Checking your approved membership and Team Work data.</p></section></main>;', premium('Opening Team Dashboard','Checking your approved membership and Team Work data.','Preparing Team Work','if (loading) return <main className="twd">')),
            'src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx': ('if(loading)return <main className="twd"><section className="twd-state"><strong>Opening Team Dashboard…</strong><p>Checking approved membership and Team Work data.</p></section></main>;', premium('Opening Team Dashboard','Checking approved membership and Team Work data.','Preparing Team Work','if(loading)return <main className="twd">')),
          }
          for name,(old,new) in targets.items():
              p=Path(name); text=p.read_text()
              if old in text: p.write_text(text.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/worker/pages/WorkerTeamDashboardPage.tsx src/features/worker/pages/WorkerTeamDashboardWorkPage.tsx src/features/worker/pages/WorkerTeamDashboardWorkPageV2.tsx
          git commit -m "feat(worker): premium team dashboard loading UI"
          git push
