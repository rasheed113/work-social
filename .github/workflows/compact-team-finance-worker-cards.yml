name: compact-team-finance-worker-cards
on:
  push:
    branches: [fix/team-finance-compact-worker-cards]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-audit finance view and compact worker cards
        run: |
          git checkout 7754c83c5a154135ab346fd40b8f4efeb958d39d^1 -- src/features/contractor/pages/ContractorTeamFinancePage.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/contractor/pages/ContractorTeamFinancePage.tsx')
          s=p.read_text()
          old='.tf-worker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px;border-radius:15px;'
          new='.tf-worker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px;border-radius:13px;'
          if old not in s:
              raise SystemExit('worker card CSS pattern not found')
          s=s.replace(old,new,1)
          old2='.tf-avatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;'
          new2='.tf-avatar{width:32px;height:32px;flex:0 0 32px;border-radius:10px;'
          if old2 not in s:
              raise SystemExit('avatar CSS pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/contractor/pages/ContractorTeamFinancePage.tsx
          git commit -m "fix: restore finance worker actions and compact cards"
          git push origin HEAD:fix/team-finance-compact-worker-cards
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/compact-team-finance-worker-cards.yml
          git commit -m "chore: remove temporary finance card workflow"
          git push origin HEAD:fix/team-finance-compact-worker-cards
