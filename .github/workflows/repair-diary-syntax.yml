name: Repair Diary JSX Syntax

# One-shot parser repair workflow; it removes itself after the verified fix.

on:
  workflow_dispatch:
  push:
    branches:
      - feat-worker-diary-organizer-final

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-worker-diary-organizer-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Find and repair the JSX parse error
        run: |
          node <<'NODE'
          const fs = require('fs');
          const moduleValue = require('typescript');
          const ts = moduleValue.default ?? moduleValue;
          const path = 'src/features/worker/pages/WorkerDiaryPage.tsx';
          const original = fs.readFileSync(path, 'utf8');

          function diagnostics(text) {
            const sf = ts.createSourceFile(path, text, 99, true, 4);
            return sf.parseDiagnostics || [];
          }

          const before = diagnostics(original);
          if (before.length === 0) {
            console.log('Diary JSX is already syntactically valid.');
            process.exit(0);
          }

          console.log(`Initial syntax diagnostics: ${before.length}`);
          for (const d of before.slice(0, 8)) console.log(ts.flattenDiagnosticMessageText(d.messageText, '\\n'), 'at', d.start, 'length', d.length);

          const positions = new Set();
          for (const d of before.slice(0, 4)) {
            const start = Math.max(0, (d.start ?? 0) - 160);
            const end = Math.min(original.length, (d.start ?? 0) + 200);
            for (let p = start; p <= end; p++) positions.add(p);
          }

          const inserts = ['}', '{', '>', '<', '/', ' />', '</>', '</>}', ')}'];
          let repaired = null;
          for (const p of positions) {
            const deleted = original.slice(0, p) + original.slice(p + 1);
            if (diagnostics(deleted).length === 0) { repaired = deleted; break; }
            for (const token of inserts) {
              const candidate = original.slice(0, p) + token + original.slice(p);
              if (diagnostics(candidate).length === 0) { repaired = candidate; break; }
            }
            if (repaired) break;
          }

          if (!repaired) {
            console.error('No single local JSX repair removed the parser diagnostics.');
            process.exit(1);
          }

          fs.writeFileSync(path, repaired);
          console.log('Applied a minimal local JSX syntax repair.');
          NODE

      - name: Verify production build
        run: npm run build

      - name: Commit verified repair and remove temporary repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/worker/pages/WorkerDiaryPage.tsx
          git rm .github/workflows/repair-diary-syntax.yml
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "fix: repair Worker Diary JSX syntax"
          git push origin HEAD:feat-worker-diary-organizer-final
